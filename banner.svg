
<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        .container {
          background: linear-gradient(-45deg, #0f172a, #1e293b, #581c87, #1e293b);
          background-size: 400% 400%;
          animation: gradient 15s ease infinite;
          color: white;
          font-family: 'Segoe UI', Roboto, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 195px;
          border-radius: 20px;
          text-align: center;
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin: 0; font-size: 42px; animation: fadeIn 1s ease-out; color: #fff; text-shadow: 0 0 20px rgba(161, 3, 252, 0.5); }
        p { margin: 10px 0 0; font-size: 20px; opacity: 0.9; animation: fadeIn 1.5s ease-out; color: #A103FC; font-weight: 500; }
      </style>
      <div class="container">
        <h1>Ana Beatriz Novais</h1>
        <p>Front-end Developer ✨ UI Design</p>
      </div>
    </div>
  </foreignObject>
</svg>
